# Config declarativa do Render (blueprint).
# Uso: no Render, "New" -> "Blueprint" -> aponta pro repo (ou pasta) do servidor.
# Ele le este arquivo e cria os recursos automaticamente.
services:
  - type: web
    name: piloto-servidor
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: node src/index.js
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: piloto-dados
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "8443"
      - key: CORS_ORIGINS
        value: "https://pilotoautomaticoia.com.br,https://www.pilotoautomaticoia.com.br,chrome-extension://*"
      - key: TRIAL_DIAS
        value: "30"
      - key: TOKEN_DIAS
        value: "10"
      - key: TOKEN_RENOVA_SEG
        value: "259200"
      - key: FP_POR_LIC
        value: "3"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
